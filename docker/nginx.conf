server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Text compresses to a fraction of its size on mobile data.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json
             application/manifest+json image/svg+xml;

  # (A location with its own add_header drops these, so each repeats them.)
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API and uploaded images: same origin as the app, so the httpOnly refresh
  # cookie works without cross-site settings.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
  }
  location /uploads/ {
    proxy_pass http://api:4000;
  }

  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # The service worker is checked on every visit, so a deploy reaches
  # installed apps straight away; a missing file is a 404, never the app.
  location = /service-worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # Single-page app: unknown paths load index.html.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
}
