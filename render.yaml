# render.yaml — Carlos Shop on Render's free tier: a Postgres database, the
# API (backend/) and the shop as a static site. The static site forwards
# /api and /uploads to the API, so the browser sees one address and sign-in
# cookies stay first-party.
#
# Free tier limits: the API sleeps after 15 minutes idle (the first request
# then takes about a minute), the database expires 30 days after it is made,
# and uploaded images are lost when the API restarts or redeploys.
#
# Values marked `sync: false` are asked for when the Blueprint is applied
# (Dashboard → Blueprints → New Blueprint Instance). Never commit them.
databases:
  - name: carlos-shop-db
    plan: free
    databaseName: carlos_shop
    user: shop

services:
  - type: web
    name: carlos-shop-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: carlos-shop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      # Visitor → static site rewrite → Render's edge → API.
      - key: TRUST_PROXY
        value: '2'
      # The shop's public address (the static site), for links in emails and CORS.
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_SAMPLE_CATALOG
        value: 'true'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: carlos-shop
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - backend/**
        - e2e/**
    envVars:
      - key: CI
        value: 'false'
      - key: GENERATE_SOURCEMAP
        value: 'false'
      - key: HUSKY
        value: '0'
      - key: REACT_APP_API_BASE_URL
        value: /api
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /api/*
        destination: https://carlos-shop-api.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://carlos-shop-api.onrender.com/uploads/*
      - type: rewrite
        source: /*
        destination: /index.html
