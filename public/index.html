<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- The shop's name and icons come from Store settings (served by the
         API), so an installed app shows the shop, not a template. The page
         refreshes the name and icon links once the settings load. -->
    <link rel="manifest" href="/api/rest/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/api/rest/app-icon/64.png" />
    <link rel="apple-touch-icon" href="/api/rest/app-icon/180.png" />
    <meta name="theme-color" content="#2F7CF6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shop" />
    <meta name="description" content="Shop online." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <title>Shop</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to use this shop.</noscript>
    <div id="root"></div>
  </body>
</html>
