# Carlos Shop on Docker Desktop
#   docker compose up -d --build
#   web app   http://localhost:8080
#   API       http://localhost:4000/api/health
#   mailbox   http://localhost:8025   (password-reset emails land here)
#   database  localhost:5433  (user shop / db carlos_shop)
name: carlos-shop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      POSTGRES_DB: carlos_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d carlos_shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://shop:${POSTGRES_PASSWORD:-shop}@db:5432/carlos_shop
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      UPLOADS_DIR: /data/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: http://localhost:8080,http://localhost:3000
      # http://localhost has no TLS; set true behind HTTPS in production.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
